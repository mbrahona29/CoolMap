<html>
<head>
<script src="https://unpkg.com/maplibre-gl@5.23.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@5.23.0/dist/maplibre-gl.css" rel="stylesheet" />
<script>
let map;
function initMap() {
  map = new maplibregl.Map({
    container: 'my_map',
    style: 'https://tiles.versatiles.org/assets/styles/colorful/style.json',
    center: [8.4, 49],
    zoom: 11
  });
}
</script>
</head>
<body onLoad="initMap()">
<input type="text" id="search_text" placeholder="Search a place" />
<button id="search_button">Search</button>
<div id="my_map" style="width:100%; height:90vh"></div>
<script src="geocoding.js"></script>
</body>
</html>
